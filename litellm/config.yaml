# LiteLLM proxy — one OpenAI-compatible endpoint in front of every provider.
#
# `model_name` is the contract with the app: it is exactly what goes into
# `AiModel.apiModelId`, and what the generation activities send as `model`.
# Keys never leave this container.
#
# Entries whose provider key is absent from .env stay listed but fail at call
# time rather than at boot, so an unconfigured provider does not stop the proxy
# serving the ones that are configured.
#
# Every Gemini entry below was verified against the project's own key with
# `models.list` + a live call. Two traps found doing that, both load-bearing:
#
#   1. `gemini-2.5-flash` still appears in `models.list` but 404s on call:
#      "no longer available to new users". Listing a model is not access to it.
#   2. Imagen is not reachable at all on this key — the only `predict`-capable
#      models it can see are Veo video ones. Gemini image generation happens
#      through `generateContent` on the `*-image` models instead, so the
#      slide pipeline calls those directly rather than through this proxy's
#      /v1/images/generations route, which targets Imagen predict.

model_list:
  # The `AiModel` rows are the only list of models, and each row carries the
  # key that pays for its calls. So there is nothing to enumerate here: a
  # wildcard routes whatever the app asks for, inferring the provider from the
  # model name and using the `api_key` sent with the request.
  #
  # The named per-provider entries that used to live here read their keys from
  # this container's environment, which made the proxy a second and staler
  # source of truth: a model had to be listed here *and* in the database, and
  # whichever key the environment held was the one that got billed regardless
  # of what the workspace had configured.
  #
  # One trap worth keeping from that era: Gemini image generation is not
  # reachable through this proxy's /v1/images/generations route, which targets
  # Imagen predict. The slide pipeline calls the Gemini `*-image` models
  # directly for their inline bytes, and comes here only for the rest.
  - model_name: "*"
    litellm_params:
      model: "*"

litellm_settings:
  set_verbose: false
  # Providers disagree on which sampling knobs exist; dropping unsupported ones
  # keeps a single caption call working across all three.
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
